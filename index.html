<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plataforma de Avaliação - Wuzuy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = { darkMode: 'class' };
        // Aplica o tema salvo ou a preferencia do sistema
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
        }
        function toggleTheme() {
            document.documentElement.classList.toggle('dark');
            localStorage.theme = document.documentElement.classList.contains('dark') ? 'dark' : 'light';
        }
    </script>
</head>
<body class="bg-gray-100 dark:bg-gray-900 font-sans text-gray-800 dark:text-gray-100 h-screen flex flex-col transition-colors duration-300">

    <nav class="bg-[#004a8f] dark:bg-gray-800 text-white p-4 shadow-md">
        <div class="max-w-5xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold truncate">Plataforma de Avaliação</h1>
            <button onclick="toggleTheme()" class="bg-white/20 hover:bg-white/30 px-3 py-1 rounded transition text-sm font-semibold">
                Alternar Tema
            </button>
        </div>
    </nav>

    <main class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white dark:bg-gray-800 p-8 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 max-w-2xl w-full text-center transition-colors">
            <h2 class="text-3xl font-bold mb-2 text-[#004a8f] dark:text-blue-400">Simulados de Java</h2>
            <p class="text-gray-600 dark:text-gray-300 mb-8">Escolha o formato da avaliação que deseja realizar.</p>
            
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                <a href="prova-alternativa.html" class="block p-6 border-2 border-gray-200 dark:border-gray-600 rounded-xl hover:border-[#004a8f] dark:hover:border-blue-400 hover:shadow-md transition group dark:bg-gray-700">
                    <h3 class="text-xl font-bold text-gray-800 dark:text-white group-hover:text-[#004a8f] dark:group-hover:text-blue-400 mb-2">Múltipla Escolha</h3>
                    <p class="text-sm text-gray-500 dark:text-gray-300">20 questões objetivas com embaralhamento automático e correção instantânea.</p>
                </a>

                <a href="prova-dissertativa.html" class="block p-6 border-2 border-gray-200 dark:border-gray-600 rounded-xl hover:border-[#004a8f] dark:hover:border-blue-400 hover:shadow-md transition group dark:bg-gray-700">
                    <h3 class="text-xl font-bold text-gray-800 dark:text-white group-hover:text-[#004a8f] dark:group-hover:text-blue-400 mb-2">Dissertativa (IA)</h3>
                    <p class="text-sm text-gray-500 dark:text-gray-300">20 questões abertas corrigidas por Inteligência Artificial.</p>
                </a>
            </div>
        </div>
    </main>

</body>
</html>
